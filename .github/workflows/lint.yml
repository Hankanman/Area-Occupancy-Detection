name: Lint

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
      - "next"

permissions: {}

jobs:
  ruff:
    name: "Ruff"
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format . --check

  basedpyright:
    name: "basedpyright"
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # The test extra brings Home Assistant, which the checker needs to
      # resolve its types.
      - name: Install dependencies
        run: uv sync --extra dev --extra test

      # Findings that existed when this was added are recorded in
      # .basedpyright/baseline.json, so only new ones fail.
      - name: Type check
        run: uv run basedpyright
