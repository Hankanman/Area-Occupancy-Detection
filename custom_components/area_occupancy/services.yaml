run_analysis:
  name: Run Analysis
  description: "Run the analysis for all areas in the area occupancy instance."

export_config:
  name: Export Config
  description: "Export the complete integration configuration as YAML."

purge_area_history:
  name: Purge Area History
  description: >-
    Delete all learned history (priors, correlations, intervals, aggregates,
    cached occupied intervals) for a single configured area, without removing
    the area from the integration. Use this when a room's learned behavior is
    no longer accurate and you want the integration to re-learn from scratch.
  fields:
    area_id:
      name: Area
      description: >-
        The Home Assistant area_id whose learned history should be purged.
      required: true
      selector:
        area: {}

set_area_option:
  name: Set Area Option
  description: >-
    Change one configured area's detection tunables from an automation or
    script. Values go through the same validation and purpose-default
    handling the configuration UI applies, so an automation cannot put an
    area into a state the UI would reject. Structural configuration (which
    entities belong to an area, adjacent areas) is deliberately not settable
    here.
  fields:
    area_id:
      name: Area
      description: The Home Assistant area_id of the configured area to change.
      required: true
      selector:
        area: {}
    threshold:
      name: Occupancy threshold
      description: >-
        Percentage above which the area counts as occupied.
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
    decay_enabled:
      name: Enable time decay
      description: Whether occupancy probability decays once evidence stops.
      selector:
        boolean:
    decay_half_life:
      name: Decay half-life
      description: >-
        Time over which occupancy probability halves. Set to 0 to follow the
        area's purpose default; any other value must be between 10 seconds
        and 1 hour.
      selector:
        duration:
          enable_day: false
    min_prior_override:
      name: Minimum prior override
      description: >-
        Floor for the learned prior, from 0 to 1. Set to 0 to disable.
      selector:
        number:
          min: 0
          max: 1
          step: 0.01
    wasp_enabled:
      name: Enable Wasp in Box
      description: Whether the Wasp in Box virtual sensor runs for this area.
      selector:
        boolean:
