run_analysis:
  name: Run Analysis
  description: "Run the analysis for all areas in the area occupancy instance."

export_config:
  name: Export Config
  description: "Export the complete integration configuration as YAML."

purge_area_history:
  name: Purge Area History
  description: >-
    Delete all learned history (priors, correlations, intervals, aggregates,
    cached occupied intervals) for a single configured area, without removing
    the area from the integration. Use this when a room's learned behavior is
    no longer accurate and you want the integration to re-learn from scratch.
  fields:
    area_id:
      name: Area
      description: >-
        The Home Assistant area_id whose learned history should be purged.
      required: true
      selector:
        area: {}

get_time_priors:
  name: Get Time Priors
  description: >-
    Return the learned weekly occupancy-prior forecast for each area: for every
    weekly slot (day of week x time of day) the probability that the area tends
    to be occupied. Unlike the occupancy_probability sensor (a current-state
    estimate), this exposes priors for future slots so other integrations can
    build a forward-looking occupancy profile (for example to pre-heat a room
    before its habitual occupancy). Returns response data only.
  fields:
    area_id:
      name: Area
      description: >-
        Optional Home Assistant area_id. When omitted, the forecast for all
        configured areas is returned.
      required: false
      selector:
        area: {}
